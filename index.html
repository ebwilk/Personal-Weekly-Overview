<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Weekly Overview - Mobile Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Subtle grey background outside the widget */
            /* Center the widget vertically and horizontally for demonstration purposes */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        
        /* Container simulating a mobile phone screen width */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 8px solid #374151; /* Dark grey border to look like a phone bezel */
        }
        
        .custom-yellow-bg {
            background-color: #Fef3c7; /* A soft, distinct yellow as seen in the PDF lookbook (e.g. pg 11 Manager Dashboard) */
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Weekly Overview Section (The requested widget) -->
        <section class="custom-yellow-bg px-5 py-6">
            <div class="flex items-center justify-between mb-4">
                 <h2 class="text-lg font-bold text-gray-900">Your personal weekly overview</h2>
                 <!-- Simple chevron icon indicating maybe a dropdown or link to full view -->

                  </svg>
            </div>

            <!-- 2x2 Grid for Metrics -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Metric Card 1: Team Size -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="flex items-start justify-between mb-2">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Team size</span>
                        <!-- Users Icon -->
                        <div class="bg-blue-50 p-1.5 rounded-lg text-lg">
                            🫂
                        </div>
                    </div>
                    <div>

                    </div>
                </div>

                <!-- Metric Card 2: Route Changes -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="flex items-start justify-between mb-2">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Route changes</span>
                         <!-- Route/Map Icon -->
                         <div class="bg-orange-50 p-1.5 rounded-lg text-lg">
                            🗺️
                        </div>
                    </div>
                    <div>
                        <span class="text-xs text-gray-700 font-medium mt-1 block leading-snug">
                            14 requested this week, 5 awaiting your sign-off
                        </span>
                    </div>
                </div>

                <!-- Metric Card 3: DOT Compliance -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="flex items-start justify-between mb-2">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">DOT compliance</span>
                        <!-- Shield/Check Icon -->
                        <div class="bg-green-50 p-1.5 rounded-lg text-lg">
                            ✅
                        </div>
                    </div>
                    <div>
                        <span class="text-xs text-gray-700 mt-1 block leading-snug">9 reviews due this month, 2 flagged urgent</span>
                    </div>
                </div>

                <!-- Metric Card 4: Open Roles -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div class="flex items-start justify-between mb-2">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Open roles</span>
                         <!-- Briefcase Icon -->
                         <div class="bg-purple-50 p-1.5 rounded-lg text-lg">
                            ✨
                        </div>
